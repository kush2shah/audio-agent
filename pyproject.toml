[project]
name = "chinook-support"
version = "0.1.0"
description = "Chinook Records customer support agent - LangChain OSS + LangSmith demo"
requires-python = ">=3.11"
dependencies = [
    "agentevals>=0.0.9",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-cli[inmem]>=0.2.0",
    "langsmith>=0.3.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chinook_support"]
